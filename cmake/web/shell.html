<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>cppGame WebGL</title>
    <link rel="icon" href="data:,">
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0d12;
            color: #eef2ff;
            font-family: sans-serif;
        }
        #wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            padding: 8px;
            gap: 8px;
        }
        canvas.emscripten {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: calc(100% - 28px);
            aspect-ratio: 16 / 9;
            border: 1px solid #3a4258;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        }
        #status {
            flex: 0 0 auto;
            min-height: 1.2em;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <div id="status">Loading WebGL build...</div>
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>
    <script>
        const statusNode = document.getElementById("status");
        const canvas = document.getElementById("canvas");
        window.Module = {
            canvas: canvas,
            setStatus: (text) => {
                if (statusNode) {
                    statusNode.textContent = text;
                }
            },
            onRuntimeInitialized: () => {
                if (statusNode) {
                    statusNode.textContent = "WebGL runtime ready";
                }
            }
        };
    </script>
    <script async src="GameEngine.js"></script>
</body>
</html>
